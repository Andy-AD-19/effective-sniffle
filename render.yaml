services:
  - type: web
    name: fmoh-inventory-api
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        value: file:/app/data/inventory.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
